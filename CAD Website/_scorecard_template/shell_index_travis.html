<title>Travis Protest Scorecard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim brand bar with the county picker, then the selected county's scorecard filling the rest of the screen. */
:root{
  --bg:#f9f9f9; --surface:#ffffff; --mint:#effdf4; --line:#e2e7e3; --ink:#001106; --ink-2:#43464d; --ink-3:#6b6f76;
  --us:#437f55; --us-ink:#2c593a; --warn:#b26b00; --wait:#8a8f8c; --st-ready:#437f55; --st-review:#a77a00; --st-limited:#c2571a; --st-needs:#b3261e;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1410; --surface:#131d17; --mint:#1a271f; --line:#2a3a30; --ink:#eef5f0; --ink-2:#b7c4bb; --ink-3:#88978d;
  --us:#6fb587; --us-ink:#a3d9b4; --warn:#e3a13a; --wait:#7d8a82; --st-ready:#6fb587; --st-review:#e0b52f; --st-limited:#f08a4b; --st-needs:#f2766b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1410; --surface:#131d17; --mint:#1a271f; --line:#2a3a30; --ink:#eef5f0; --ink-2:#b7c4bb; --ink-3:#88978d;
  --us:#6fb587; --us-ink:#a3d9b4; --warn:#e3a13a; --wait:#7d8a82; --st-ready:#6fb587; --st-review:#e0b52f; --st-limited:#f08a4b; --st-needs:#f2766b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--us)}
.brand{font:800 15px/1 var(--sans);color:var(--us);letter-spacing:.01em}
.lab{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pick{display:flex;align-items:center;gap:10px}
select{font:600 14px var(--sans);color:var(--ink);background:var(--mint);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:220px}
select:focus-visible{outline:2px solid var(--us);outline-offset:2px}
.chip{--c:var(--st-ready);display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.chip::before,.key i{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.st-review{--c:var(--st-review)}.st-limited{--c:var(--st-limited)}.st-needs{--c:var(--st-needs)}.st-ready{--c:var(--st-ready)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-3);padding:6px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.key span{display:inline-flex;align-items:center;gap:5px}.key i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.key b{font-weight:600;color:var(--ink-2)}
.sub{color:var(--ink-3);font-size:12.5px;flex:1 1 260px;min-width:0}
main{flex:1;min-height:0;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.status{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:40px 60px;display:flex;flex-direction:column;gap:16px;overflow:auto;height:100%;box-sizing:border-box}
.status h1{font:700 30px/1.15 var(--sans);margin:0;text-wrap:balance}
.status p{margin:0;color:var(--ink-2);max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h2{font:600 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0}
.card ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.card.miss h2{color:var(--warn)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-weight:600}
.list button:hover,.list button:focus-visible{border-color:var(--us)}
.views{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--mint)}
.views[hidden]{display:none}
.views button{font:600 12.5px var(--sans);color:var(--ink-2);background:transparent;border:0;border-right:1px solid var(--line);padding:7px 11px;cursor:pointer}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--us);color:#fff}
.views button:focus-visible{outline:2px solid var(--us);outline-offset:2px}
/* Neighborhood lookup view */
.lkw{height:100%;overflow:auto}
.lk{max-width:1180px;margin:0 auto;padding:22px 20px 70px;display:flex;flex-direction:column;gap:18px}
.lk h1{font:700 24px/1.2 var(--sans);margin:0}
.lk h2{font:700 17px/1.25 var(--sans);margin:0}
.lk h3{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.lk .note{color:var(--ink-3);font-size:12.5px;margin:4px 0 0;max-width:110ch}
.lk-ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.lk-ctl label{display:flex;flex-direction:column;gap:5px;font:600 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lk-ctl input,.lk-ctl select,.lk-ctl button,.lk-in{font:500 13.5px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0}
.lk-ctl select{min-width:0;max-width:240px}
.lk-ctl input:focus-visible,.lk-ctl select:focus-visible,.lk button:focus-visible,.lk-in:focus-visible{outline:2px solid var(--us);outline-offset:1px}
.lk-ctl .nbin{width:230px}.lk-ctl .idin{width:150px}
.lk-ctl .grp{display:flex;gap:6px}
.lk button.pri{background:var(--us);border-color:var(--us);color:#fff;font-weight:600;cursor:pointer}
.lk button.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font:600 12.5px var(--sans);cursor:pointer}
.lk button.sec:hover{border-color:var(--us)}
.lk-msg{font-size:13px;color:var(--ink-2)}.lk-msg:empty{display:none}
.lk-msg.err{color:var(--st-needs)}
.panel2{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.tile.us{border-color:var(--us);background:var(--mint)}
.tile.cmp{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.tile .t{font:600 11.5px/1.25 var(--sans);color:var(--ink-3)}
.tile .v{font:500 22px/1.1 var(--mono);color:var(--ink)}
.tile.us .v{color:var(--us-ink)}
.tile .s{font:400 12px/1.35 var(--mono);color:var(--ink-3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 11px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;position:sticky;top:0}
.tbl th.n,.tbl td.n{text-align:right}
.tbl th[data-s]{cursor:pointer}.tbl th[data-s]:hover{color:var(--ink)}
.tbl th .ar{font-family:var(--mono)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n,.tbl td.m{font-family:var(--mono);font-size:12.5px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.us td{background:var(--mint);color:var(--us-ink);font-weight:600}
.tbl tr.cmp td{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:color-mix(in srgb,var(--us) 9%,transparent)}
.tbl tr.sel td{background:color-mix(in srgb,var(--us) 14%,transparent)}.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--us)}
.lk>*,.panel2>*,.lk-ctl>*{min-width:0}
.pos{color:var(--us)}.neg{color:var(--st-needs)}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-2)}
.filters label{display:inline-flex;gap:6px;align-items:center}
.filters input[type=number]{width:56px}
.filters input[type=search]{width:200px}
.reply{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.reply{grid-template-columns:minmax(0,1fr)}}
.reply>*,.calc .row>*{min-width:0}.calc label{line-height:1.25}
.reply pre{white-space:pre-wrap;font:400 13.5px/1.55 var(--sans);margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--ink)}
.calc .row{display:flex;gap:12px;flex-wrap:wrap}
.calc label{display:flex;flex-direction:column;gap:4px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.calc .lk-in{width:90px}
.est{font-size:12px;color:var(--ink-3);margin:0}
.badge{font:600 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);margin-left:6px;vertical-align:middle}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
/* Account search */
.modes{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--mint)}
.modes button{font:600 12.5px var(--sans);color:var(--ink-2);background:transparent;border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer}
.modes button:last-child{border-right:0}
.modes button[aria-selected="true"]{background:var(--us-ink);color:#fff}
:root[data-theme="dark"] .modes button[aria-selected="true"]{color:#0c1410}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modes button[aria-selected="true"]{color:#0c1410}}
.modes button:focus-visible{outline:2px solid var(--us);outline-offset:2px}
.bar[data-mode="search"] .pick,.bar[data-mode="search"] #views,.bar[data-mode="search"] #chip{display:none}
.as-q{flex:1 1 320px}.as-q input{width:100%}
.hdr{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.hdr .id{font:500 22px/1.2 var(--mono)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px 16px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font:600 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.facts dd.na{color:var(--ink-3);font-style:italic}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.flag.us{background:var(--mint);color:var(--us-ink);box-shadow:inset 0 0 0 1px var(--us)}
.flag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.flag.bad{background:color-mix(in srgb,var(--st-needs) 13%,transparent);color:var(--st-needs)}
.vchart{width:100%;height:auto;display:block}
.vchart text{font:500 11px var(--mono);fill:var(--ink-3)}
.yrpick{display:inline-flex;gap:4px;flex-wrap:wrap}
.yrpick button{font:600 12px var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:4px;padding:4px 8px;cursor:pointer}
.yrpick button[aria-pressed="true"]{background:var(--us);border-color:var(--us);color:#fff}
.cmpbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:6px 10px;align-items:center;font-size:13px}
.cmpbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpbar .trk{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.cmpbar .fill{height:100%;background:var(--ink-3);border-radius:3px}
.cmpbar .fill.me{background:var(--st-review)}.cmpbar .fill.us{background:var(--us)}
.cmpbar .val{font-family:var(--mono);font-size:12.5px;text-align:right}
</style>

<div class="bar" role="banner">
  <span class="brand">Property Tax Protest</span>
  <div class="modes" id="modes" role="tablist" aria-label="Section"><button type="button" role="tab" data-m="cards" aria-selected="true">Scorecards</button><button type="button" role="tab" data-m="search" aria-selected="false">Account search</button></div>
  <div class="pick"><label class="lab" for="county">County</label><select id="county"></select></div>
  <div class="views" id="views" role="group" aria-label="Dashboard view" hidden></div>
  <span id="chip" class="chip"></span>
  <span id="sub" class="sub"></span>
</div>
<div class="key" id="key" aria-label="Status key"></div>
<main id="main"></main>

<script>
const C=[
 {k:'travis',n:'Travis',st:'review',file:'travis.html',sub:'2026 · protax JSON Oct 6 + certified roll Oct 6 · one row per property · market value · agent 1863738'}
];
C.sort((a,b)=>a.n.localeCompare(b.n));
const ST={ready:{l:'Ready',d:'🟢',t:'reviewed and current'},review:{l:'Draft · needs review',d:'🟡',t:'full build, waiting on your review and answers'},limited:{l:'Draft · limited data',d:'🟠',t:'built, but the file is missing key fields, so sections are hidden'},needs:{l:'Needs data',d:'🔴',t:'can’t be built until the developers send more'}};
const LBL=Object.fromEntries(Object.entries(ST).map(([k,v])=>[k,v.l]));
const viewsEl=document.getElementById('views'),sel=document.getElementById('county'),main=document.getElementById('main'),chip=document.getElementById('chip'),sub=document.getElementById('sub');
sel.innerHTML=C.map(o).join('');
document.getElementById('key').innerHTML=Object.entries(ST).map(([k,v])=>`<span class="st-${k}" title="${v.t}"><i></i><b>${v.l}</b>${C.filter(c=>c.st==k).length}</span>`).join('');
function o(c){return `<option value="${c.k}">${ST[c.st].d}\u2002${c.n}</option>`}
const cache={};
/* In-page links (#section) inside the scorecard would otherwise resolve against this page's URL; keep them inside the frame. */
const ANCHOR='<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest(\'a[href^="#"]\');if(!a)return;var el=document.getElementById(a.getAttribute("href").slice(1));e.preventDefault();if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});<\/script>';
function syncTheme(fr){try{const t=document.documentElement.getAttribute('data-theme'),r=fr.contentDocument&&fr.contentDocument.documentElement;if(!r)return;t?r.setAttribute('data-theme',t):r.removeAttribute('data-theme')}catch(e){}}
let current=null;
function show(key){
  if(String(key||'').startsWith('search'))return showSearch(key);
  document.querySelector('.bar').dataset.mode='cards';setModes('cards');
  const [k,vk]=String(key||'').split('-');lastCard=String(key||'');
  const c=C.find(x=>x.k==k)||C[0];const VW=[...(c.views||[]),...(c.file&&LK[c.k]?[{v:'nb',n:'Neighborhood lookup',lk:1}]:[])];const vw=VW.find(v=>v.v==vk)||null;current=c;sel.value=c.k;
  const page=vw?(vw.lk?{k:c.k+'-nb',n:c.n+' neighborhood lookup',lk:1,sub:'Search a neighborhood code or one of our property IDs · '+LK[c.k].note}:{k:c.k+'-'+vw.v,n:c.n+' '+vw.n,file:vw.file,sub:vw.sub}):{k:c.k,n:c.n,file:c.file,sub:c.sub};current=page;
  viewsEl.hidden=!VW.length;if(VW.length){viewsEl.innerHTML=[{v:'',n:'Scorecard'},...VW].map(v=>`<button type="button" data-v="${v.v}" aria-pressed="${(vw?vw.v:'')===v.v}">${v.n}</button>`).join('');viewsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>show(c.k+(b.dataset.v?'-'+b.dataset.v:'')))}
  chip.textContent=LBL[c.st];chip.className='chip st-'+c.st;chip.title=ST[c.st].t;sub.textContent=page.sub;
  document.title=page.n+' · Travis';
  try{localStorage.setItem('ptp-county',page.k)}catch(e){}
  if(location.hash.slice(1)!=page.k)history.replaceState(null,'','#'+page.k);
  if(page.lk){showLookup(c,page)}else if(page.file){const c=page;
    main.innerHTML='<div class="loading">Loading the '+c.n+' scorecard…</div><iframe id="fr" title="'+c.n+' protest scorecard"></iframe>';
    const fr=document.getElementById('fr');fr.addEventListener('load',()=>{syncTheme(fr);const l=main.querySelector('.loading');if(l)l.remove()});
    (cache[c.k]?Promise.resolve(cache[c.k]):fetch(c.file).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})).then(t=>{cache[c.k]=t;if(current===c)fr.srcdoc=t+ANCHOR})
      .catch(()=>{main.innerHTML='<div class="status"><h1>Couldn’t load '+c.n+'</h1><p>The page file didn’t load. Reload the page to try again.</p></div>'});
  }else{
    main.innerHTML=`<div class="status"><span class="lab">${LBL[c.st]}</span><h1>${c.n} County</h1><p>${c.sub}. It will use the same layout, sections and controls as Collin, with sections hidden where the data can’t support them.</p>
      <div class="grid">${c.have.length?`<div class="card"><h2>In the developers’ file</h2><ul>${c.have.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}<div class="card miss"><h2>Missing or flagged</h2><ul>${c.need.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
      <span class="lab" style="margin-top:12px">Built so far</span><div class="list">${C.filter(x=>x.file).map(x=>`<button type="button" data-k="${x.k}">${x.n}<span class="chip st-${x.st}">${LBL[x.st]}</span></button>`).join('')}</div></div>`;
    main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>show(b.dataset.k));
  }
}
/* ---------- Neighborhood lookup ---------- */
const LK={
 travis:{note:'2026 · protax JSON (Oct 6), one appeal per property · market value (notice to final) · TCAD market area code'}
};
const lkCache={},LS={};
const f$=v=>v==null||isNaN(v)?'–':(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('en-US');
const fp=(v,d=1)=>v==null||!isFinite(v)?'–':(v*100).toFixed(d)+'%';
const fn=v=>Math.round(v).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lkIndex(d){
  if(d.ix)return;d.ix=d.years.map(()=>new Map());
  for(const r of d.rows){const m=d.ix[r[0]];let a=m.get(r[1]);if(!a)m.set(r[1],a=[]);a.push(r)}
  d.ox=d.years.map(()=>new Map());for(const r of d.open){const m=d.ox[r[0]];let a=m.get(r[1]);if(!a)m.set(r[1],a=[]);a.push(r)}
  d.byId=new Map();for(const o of d.ours){const k=String(o[1]).trim().toUpperCase();let a=d.byId.get(k);if(!a)d.byId.set(k,a=[]);a.push(o)}
  d.nbIx=new Map(d.nbs.map((x,i)=>[String(x[0]).toUpperCase(),i]));
  /* default comparison: Ownwell when it has closed results in the latest year, else the agent group with the most */
  const ly=d.years.length-1,cl=d.firms.map(()=>0);for(const r of d.rows)if(r[0]==ly)cl[r[2]]+=r[4];
  const ow=d.firms.findIndex(f=>/ownwell/i.test(f));
  let best=-1;d.firms.forEach((f,i)=>{if(i&&!/^(Owners|No agent|Other agents \(smaller)/.test(f)&&(best<0||cl[i]>cl[best]))best=i});
  d.cmp0=ow>0&&cl[ow]>=30?ow:best>0?best:1;
}
/* firm totals for one neighborhood, year and value range */
function lkAgg(d,y,nb,t){
  const out=d.firms.map(()=>({n:0,w:0,ss:0,sc:0,sp:0,o:0}));
  for(const r of d.ix[y].get(nb)||[]){if(t>=0&&r[3]!=t)continue;const a=out[r[2]];a.n+=r[4];a.w+=r[5];a.ss+=r[6];a.sc+=r[7];a.sp+=r[8]}
  for(const r of d.ox[y].get(nb)||[])out[r[2]].o+=r[3];
  return out;
}
const sumA=arr=>arr.reduce((a,x)=>({n:a.n+x.n,w:a.w+x.w,ss:a.ss+x.ss,sc:a.sc+x.sc,sp:a.sp+x.sp,o:a.o+x.o}),{n:0,w:0,ss:0,sc:0,sp:0,o:0});

function showSearch(key){
  current={k:'search',n:'Account search'};document.querySelector('.bar').dataset.mode='search';setModes('search');
  sub.textContent='Look up any protested property: history, who handled it, how it compares with its neighborhood';document.title='Account search · Travis';
  try{localStorage.setItem('ptp-county','search')}catch(e){}
  if(location.hash.slice(1).split('=')[0]!='search')history.replaceState(null,'','#search');
  const ks=Object.keys(AS).sort((a,b)=>C.find(c=>c.k==a).n.localeCompare(C.find(c=>c.k==b).n));
  if(!AQ.k){let last='';try{last=localStorage.getItem('ptp-as-county')||''}catch(e){}AQ.k=AS[last]||last=='all'?last:'all'}
  const deep=/^search=(\w+):(.+)$/.exec(key||'');if(deep&&AS[deep[1]]){AQ.k=deep[1];AQ.q=decodeURIComponent(deep[2])}
  main.innerHTML=`<div class="lkw"><div class="lk">
   <div><h1>Account search</h1><p class="note">Every property protested in Travis in 2026, one row per property (the same rules as the scorecard). Search a property ID, an address or an owner name.</p></div>
   <form class="lk-ctl" id="as-f" role="search">
    <label>County<select id="as-k"><option value="all">All counties</option>${ks.map(k=>`<option value="${k}">${C.find(c=>c.k==k).n}${AS[k].txt?' · '+AS[k].txt:''}</option>`).join('')}</select></label>
    <label class="as-q">Account ID, address or owner<input id="as-q" autocomplete="off" spellcheck="false" placeholder="e.g. 635086 or 12441 Stansbury or Smith"></label>
    <button class="pri" type="submit">Search</button>
   </form>
   <div class="lk-msg" id="as-msg" role="status"></div>
   <section id="as-res"></section>
   <section id="as-det"></section></div></div>`;
  const $=id=>document.getElementById(id);$('as-k').value=AQ.k;$('as-q').value=AQ.q;
  $('as-k').onchange=e=>{AQ.k=e.target.value;try{localStorage.setItem('ptp-as-county',AQ.k)}catch(_){}};
  $('as-f').onsubmit=e=>{e.preventDefault();AQ.q=$('as-q').value.trim();run()};
  if(AQ.hit&&!deep)renderAcct(AQ.hit);else if(AQ.q)run();else $('as-q').focus();
  async function run(){
    const q=AQ.q,msg=$('as-msg');$('as-res').innerHTML='';$('as-det').innerHTML='';if(!q)return;
    const ks2=AQ.k=='all'?ks:[AQ.k];msg.className='lk-msg';msg.textContent='Searching '+(AQ.k=='all'?'all counties':C.find(c=>c.k==AQ.k).n)+'…';
    const idLike=!/\s/.test(q)&&/\d/.test(q);let hits=[];
    try{
      if(idLike){hits=(await Promise.all(ks2.map(k=>asById(k,q).catch(()=>null)))).filter(Boolean)}
      if(!hits.length){const t=(await Promise.all(ks2.map(k=>asText(k,q).catch(()=>[])))).flat();
        if(t.length==1){const h=await asById(t[0].k,t[0].id);if(h)hits=[h]}else if(t.length){msg.textContent='';return list(t)}}
    }catch(e){msg.className='lk-msg err';msg.textContent='Search failed to load data. Try again.';return}
    if(!hits.length){msg.className='lk-msg err';const noTxt=ks2.filter(k=>!AS[k].txt).map(k=>C.find(c=>c.k==k).n);
      const where=AQ.k=='all'?'any county':C.find(c=>c.k==AQ.k).n+' ('+AS[AQ.k].yrs+')';
      msg.textContent=(idLike?'No protest on record for account '+q+' in '+where+'. Account search only covers accounts protested in 2026. The usual reasons: it wasn’t protested in those years, it isn’t residential, or the ID is in a different format for that county.':'No match for "'+q+'" among protested residential properties in '+where+'.')+(noTxt.length&&!idLike?' Address and owner search isn’t available for '+noTxt.join(', ')+' (not in those files), so use the account ID there.':'');return}
    msg.textContent=hits.length>1?'Found in '+hits.length+' counties. Pick one:':'';
    if(hits.length>1)return list(hits.map(h=>({k:h.k,n:h.n,id:h.a[0],addr:h.a[1],own:h.a[2],h})));
    AQ.hit=hits[0];renderAcct(hits[0]);
  }
  function list(rows){
    $('as-res').innerHTML=`<div class="panel2"><h3>${rows.length>=200?'First 200 matches · add more words to narrow it':rows.length+' matches'}</h3><div class="tw" style="max-height:460px;overflow:auto"><table class="tbl"><thead><tr><th>County</th><th>Account</th><th>Address</th><th>Owner</th></tr></thead><tbody>
     ${rows.map((r,i)=>`<tr class="click" data-i="${i}" tabindex="0"><td>${C.find(c=>c.k==r.k).n}</td><td class="m">${esc(r.id)}</td><td>${esc(r.addr||'')}</td><td>${esc(r.own||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
    $('as-res').querySelectorAll('tr[data-i]').forEach(tr=>{const go=async()=>{const r=rows[+tr.dataset.i];const h=r.h||await asById(r.k,r.id);if(h){AQ.hit=h;$('as-res').querySelectorAll('tr').forEach(x=>x.classList.toggle('sel',x===tr));renderAcct(h);$('as-det').scrollIntoView({behavior:'smooth',block:'start'})}};tr.onclick=go;tr.onkeydown=e=>{if(e.key=='Enter')go()}});
  }
}
function setModes(m){const el=document.getElementById('modes');el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.m==m))}
async function renderAcct(h){
  const el=document.getElementById('as-det');if(!el)return;const {k,a,m}=h,cn=C.find(c=>c.k==k).n,D=m.dicts,ci={};m.cols.forEach((c,i)=>ci[c]=i);
  const BY={AG:'Agent',OW:'Owner',ANR:'Agent (not of record)',OT:'Other',AGENT:'Agent',OWNER:'Owner'};
  const v=(r,c)=>{const x=r[ci[c]];if(x==null)return null;let o=(D[c]&&D[c].length&&typeof x=='number'&&c!='y'&&c in D?D[c][x]:x);if(c=='by')o=String(o).split('/').map(z=>BY[z.trim().toUpperCase()]||z).join(' / ');return o};
  const yrs=a[3].slice().sort((p,q)=>q[ci.y]-p[ci.y]),last=yrs[0],ourYrs=yrs.filter(r=>r[ci.ours]).map(r=>r[ci.y]).sort();
  const capped=false;
  const pc=r=>{const s=r[ci.s],c=r[ci.cut];return s>0&&c!=null&&!r[ci.op]?Math.max(c,0)/s:null};
  const dt=x=>x?new Date(x+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'–';
  const flags=[];if(ourYrs.length)flags.push(`<span class="flag us">Our client: ${ourYrs.join(', ')}</span>`);
  if(!last[ci.ours]&&ourYrs.length)flags.push(`<span class="flag bad">Not ours in ${last[ci.y]} (${esc(v(last,'firm')||'unknown')})</span>`);
  else if(!ourYrs.length)flags.push(`<span class="flag warn">Prospect · ${esc(v(last,'firm')||'unknown')} in ${last[ci.y]}</span>`);
  if(last[ci.op])flags.push('<span class="flag warn">Open protest in '+last[ci.y]+'</span>');
  const totCut=yrs.reduce((s,r)=>s+(r[ci.op]?0:Math.max(r[ci.cut]||0,0)),0),totFee=yrs.reduce((s,r)=>s+(r[ci.fee]||0),0);
  const pick=(c)=>{for(const r of yrs){const x=v(r,c);if(x!=null&&x!=='')return x}return null};
  const hs=pick('hs'),na='<dd class="na">not in file</dd>',dd=x=>x==null||x===''?na:`<dd>${esc(x)}</dd>`;
  const ptype=[v(last,'cls'),pick('sc')?'state code '+pick('sc'):null,pick('extra')].filter(Boolean).join(' · ');
  /* value chart */
  const cy=yrs.slice().reverse(),mx=Math.max(1,...cy.map(r=>r[ci.s]||0)),W=Math.min(640,60+cy.length*130),H=130,bw=Math.min(60,(W-40)/cy.length/2.6);
  const chart=`<svg class="vchart" viewBox="0 0 ${W} ${H+24}" style="max-width:${W}px" role="img" aria-label="Notice and final value by year">${cy.map((r,i)=>{const x=30+i*(W-40)/cy.length,hs_=(r[ci.s]||0)/mx*H,hf=r[ci.op]?0:(r[ci.f]||0)/mx*H;
     return `<rect x="${x}" y="${H-hs_}" width="${bw}" height="${hs_}" rx="2" fill="var(--line)"><title>${r[ci.y]} notice ${f$(r[ci.s])}</title></rect><rect x="${x+bw+3}" y="${H-hf}" width="${bw}" height="${hf}" rx="2" fill="${r[ci.ours]?'var(--us)':'var(--st-review)'}"><title>${r[ci.y]} final ${r[ci.op]?'open':f$(r[ci.f])}</title></rect><text x="${x+bw}" y="${H+16}" text-anchor="middle">${r[ci.y]}</text>`}).join('')}</svg>`;
  const anyCol=c=>yrs.some(r=>r[ci[c]]!=null&&r[ci[c]]!=='');
  const odate=r=>r[ci.op]?'<span class="est">open</span>':r[ci.res]?dt(r[ci.res]):r[ci.heard]?dt(r[ci.heard])+' <span class="est">(hearing)</span>':'<span class="est">not in file</span>';
  el.innerHTML=`<div class="panel2">
   <div class="hdr"><span class="id">${esc(a[0])}</span><h2>${esc(cn)} County</h2>${a[1]?`<span>${esc(a[1])}</span>`:''}</div>
   <div class="flags">${flags.join('')}</div>
   ${AS[k].note?`<p class="note" style="margin:0">${esc(AS[k].note)}</p>`:''}
   <dl class="facts">
    <div><dt>Address</dt>${dd(a[1])}</div><div><dt>Owner</dt>${dd(a[2])}</div>
    <div><dt>Homestead</dt>${dd(hs==null?null:hs?'Yes':'No')}</div><div><dt>Property type</dt>${dd(ptype)}</div>
    <div><dt>Neighborhood</dt>${dd(v(last,'nb'))}</div><div><dt>City / ZIP</dt>${dd([pick('city'),pick('zip')].filter(Boolean).join(' ')||null)}</div>
    <div><dt>Year built / sq ft</dt>${dd([pick('yrb'),pick('sf')?fn(pick('sf'))+' sf':null].filter(Boolean).join(' · ')||null)}</div>
    <div><dt>Total cut, all years</dt><dd class="m">${f$(totCut)}${capped?' (capped)':''}</dd></div>
    ${ourYrs.length?`<div><dt>Our est. fees, all years</dt><dd>${f$(totFee)}</dd></div>`:''}
   </dl>
   <h3>Value by year <span class="est" style="text-transform:none;letter-spacing:0;font-weight:400">· grey = notice, green = final with us, gold = final with someone else</span></h3>${chart}
   <h3>Protest history</h3>
   <div class="tw"><table class="tbl"><thead><tr><th>Year</th><th>Handled by</th><th>Agent(s) on file</th>${anyCol('by')?'<th>Filed by</th>':''}<th>Path</th><th>Outcome</th><th>Outcome date</th>${anyCol('htype')?'<th>Hearing type</th>':''}<th class="n">Notice</th><th class="n">Final</th><th class="n">Cut</th><th class="n">Cut %</th>${anyCol('heard')&&anyCol('res')?'<th>Hearing</th>':''}${anyCol('fee')?'<th class="n">Our est. fee</th>':''}${anyCol('panel')?'<th>ARB panel</th>':''}${anyCol('appr')?'<th>Appraiser</th>':''}${anyCol('nc')?'<th class="n">Protests</th>':''}</tr></thead><tbody>
   ${yrs.map(r=>`<tr class="${r[ci.ours]?'us':''}"><td class="m">${r[ci.y]}</td><td>${esc(v(r,'firm')||'–')}</td><td style="white-space:normal;min-width:160px">${esc(v(r,'agents')||'–')}</td>${anyCol('by')?`<td>${esc(v(r,'by')||'')}</td>`:''}<td>${r[ci.op]?'Open':esc(v(r,'bucket')||'')}</td><td style="white-space:normal;min-width:150px">${esc([v(r,'outcome'),v(r,'status')].filter(Boolean).join(' · '))}</td><td>${odate(r)}</td>${anyCol('htype')?`<td>${esc(v(r,'htype')||'')}</td>`:''}<td class="n">${f$(r[ci.s])}</td><td class="n">${r[ci.op]?'open':f$(r[ci.f])}</td><td class="n">${r[ci.op]?'–':f$(Math.max(r[ci.cut]||0,0))}</td><td class="n">${fp(pc(r))}</td>${anyCol('heard')&&anyCol('res')?`<td>${dt(r[ci.heard])}</td>`:''}${anyCol('fee')?`<td class="n">${r[ci.fee]!=null?f$(r[ci.fee]):''}</td>`:''}${anyCol('panel')?`<td style="white-space:normal">${esc(v(r,'panel')||'')}</td>`:''}${anyCol('appr')?`<td>${esc(v(r,'appr')||'')}</td>`:''}${anyCol('nc')?`<td class="n">${r[ci.nc]??''}</td>`:''}</tr>`).join('')}
   </tbody></table></div>
   <p class="est">Outcome date = the day the protest was resolved. Where the file has no resolution date, the hearing date is shown, marked "(hearing)". Travis dates come from the appeal: the informal or formal meeting and the finalized date.${k=='collin'?' Collin dates come from the protest snapshots and hearing records, so many informal settlements have none.':''}</p>
   ${capped?'<p class="est">Values are capped (taxable) value: notice capped value to the current assessed value.</p>':''}
   <div id="as-nb"></div></div>`;
  /* neighborhood comparison */
  const nbEl=document.getElementById('as-nb');
  if(!LK[k]){nbEl.innerHTML='';return}
  let d;try{d=lkCache[k]||(lkCache[k]=await fetch('lookup/'+k+'.json').then(r=>r.json()));lkIndex(d)}catch(e){nbEl.innerHTML='<p class="empty">Neighborhood data didn’t load.</p>';return}
  let sy=yrs.find(r=>!r[ci.op])||last;
  const draw=()=>{const y=sy[ci.y],yi=d.years.indexOf(y),nbc=v(sy,'nb'),ni=nbc==null?null:d.nbIx.get(String(nbc).toUpperCase());
    const pick2=`<span class="yrpick">${yrs.map(r=>`<button type="button" data-y="${r[ci.y]}" aria-pressed="${r===sy}">${r[ci.y]}</button>`).join('')}</span>`;
    if(yi<0||ni==null){nbEl.innerHTML=`<h3 style="margin-top:6px">Neighborhood comparison</h3>${pick2}<p class="empty">No neighborhood results for ${y}${v(sy,'cls')!='Residential'?' (the comparison covers residential properties only)':''}.</p>`;bind();return}
    const s=sy[ci.s],t=s<2e5?0:s<4e5?1:s<6e5?2:s<1e6?3:4;
    const rowsFor=tt=>{const A=lkAgg(d,yi,ni,tt),all=sumA(A),mine=v(sy,'firm'),fi=d.firms.indexOf(mine),ow=d.firms.findIndex(f=>/ownwell/i.test(f));
      const L=[{l:'This property',p:pc(sy),cls:'me',n:''}];
      L.push({l:'Property Tax Protest (us)',p:avgP(A[0]),n:A[0].n,cls:'us'});
      if(fi>0)L.push({l:mine,p:avgP(A[fi]),n:A[fi].n});
      if(ow>0&&ow!=fi)L.push({l:d.firms[ow],p:avgP(A[ow]),n:A[ow].n});
      const own=d.firms.findIndex(f=>/^(Owners|No agent|All other accounts)/.test(f));if(own>0&&own!=fi)L.push({l:d.firms[own],p:avgP(A[own]),n:A[own].n});
      L.push({l:'Everyone in the neighborhood',p:avgP(all),n:all.n});return L};
    const bars=L=>{const mx=Math.max(.01,...L.map(x=>x.p||0));return `<div class="cmpbar">${L.map(x=>`<span class="lbl" title="${esc(x.l)}">${esc(x.l)}${x.n!==''?` <span class="est">(${x.n||0})</span>`:''}</span><span class="trk"><span class="fill ${x.cls||''}" style="width:${x.p==null?0:Math.max(1,x.p/mx*100)}%;display:block"></span></span><span class="val">${fp(x.p)}</span>`).join('')}</div>`};
    nbEl.innerHTML=`<h3 style="margin-top:6px">Neighborhood comparison · ${esc(nbc)}</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pick2}<button type="button" class="sec" id="as-open">Open in neighborhood lookup</button></div>
     <div class="grid2x" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px">
      <div><p class="note" style="margin:0 0 8px">Average reduction, all values, ${y}. Closed protests in the neighborhood (count).</p>${bars(rowsFor(-1))}</div>
      <div><p class="note" style="margin:0 0 8px">Same value range only (${d.tiers[t]}).</p>${bars(rowsFor(t))}</div></div>`;
    bind();
    document.getElementById('as-open').onclick=()=>{LKGO[k]={y,nb:nbc,id:a[0]};show(k+'-nb')};
  };
  const bind=()=>nbEl.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{sy=yrs.find(r=>r[ci.y]==+b.dataset.y);draw()});
  draw();
}

let lastCard='';
document.getElementById('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.m=='search')show('search');else show(lastCard&&!lastCard.startsWith('search')?lastCard:sel.value||'travis')});
sel.onchange=e=>show(e.target.value);
new MutationObserver(()=>{const fr=document.getElementById('fr');if(fr)syncTheme(fr)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&(!current||k!=current.k))show(k)});
const known=h=>!!h&&(String(h).startsWith('search')||C.some(c=>c.k==String(h).split('-')[0]));
let start=location.hash.slice(1);if(!known(start)){try{start=localStorage.getItem('ptp-county')}catch(e){}}
show(known(start)?start:'travis');
</script>
